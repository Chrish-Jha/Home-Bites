<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}HomeBites{% endblock %}</title>
<link rel="icon" href="/media/Logo/Logo_Circular.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #00aa66;
  --primary-dark: #008f55;
  --accent: #00ff9c;
  --blue: #0099ff;
  --dark: #111;
  --sidebar: #121212;
  --text: #1f2937;
  --muted: #6b7280;
  --bg: #f4f7fb;
  --white: #fff;
  --border: #e5e7eb;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  --sidebar-width: 280px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

h1, h2, h3, h4 {
  font-family: 'Poppins', Arial, sans-serif;
}

a { color: inherit; text-decoration: none; }

.app-layout {
  display: grid;
  grid-template-columns: var(--sidebar-width) 1fr;
  min-height: 100vh;
}

.sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar);
  color: var(--white);
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  border-right: 1px solid #242424;
}

.brand {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 12px;
  min-height: 64px;
  padding: 8px 10px;
  margin-bottom: 18px;
}

.brand img {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  object-fit: cover;
  flex-shrink: 0;
}

.brand span {
  font-family: 'Poppins', sans-serif;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.2;
}

.user-card {
  text-align: center;
  background: linear-gradient(145deg, rgba(0, 170, 102, 0.22), rgba(0, 153, 255, 0.18));
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  padding: 18px 14px;
  margin-bottom: 22px;
}

.user-avatar {
  width: 72px;
  height: 72px;
  margin: 0 auto 12px;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid rgba(255, 255, 255, 0.85);
  background: var(--white);
}

.user-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.user-card h3 {
  font-size: 0.98rem;
  margin-bottom: 4px;
  line-height: 1.3;
}

.user-card p {
  font-size: 0.8rem;
  color: #d1d5db;
  word-break: break-word;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}

.nav-link {
  display: grid;
  grid-template-columns: 28px 1fr;
  align-items: center;
  gap: 12px;
  min-height: 46px;
  padding: 0 14px;
  border-radius: 12px;
  color: #e5e7eb;
  font-weight: 500;
  font-size: 0.94rem;
  transition: background 0.2s, color 0.2s, transform 0.2s;
}

.nav-icon {
  width: 28px;
  text-align: center;
  font-size: 1rem;
  line-height: 1;
}

.nav-text {
  line-height: 1.2;
}

.nav-link:hover,
.nav-link.active {
  background: var(--primary);
  color: var(--white);
  transform: translateX(2px);
}

.nav-link.logout-link:hover {
  background: #dc2626;
}

.sidebar-footer {
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid #2a2a2a;
  text-align: center;
  font-size: 0.8rem;
  color: #9ca3af;
}

.main {
  min-width: 0;
  padding: 28px;
}

.topbar {
  display: none;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.menu-btn {
  display: none;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 1.1rem;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.page-header h1 {
  font-size: clamp(1.35rem, 2.5vw, 1.9rem);
  margin-bottom: 6px;
}

.page-header p {
  color: var(--muted);
  max-width: 720px;
}

.panel {
  background: var(--white);
  border-radius: 16px;
  padding: 22px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  box-shadow: var(--shadow);
  text-align: center;
}

.stat-card p {
  color: var(--muted);
  font-size: 0.88rem;
  margin-bottom: 6px;
}

.stat-card h3 {
  color: var(--primary);
  font-size: 1.5rem;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 10px;
  border: none;
  font-weight: 600;
  font-size: 0.92rem;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}

.btn:hover { transform: translateY(-1px); }

.btn-primary {
  background: var(--primary);
  color: var(--white);
}

.btn-primary:hover { background: var(--primary-dark); }

.btn-secondary {
  background: #eef2f7;
  color: var(--text);
}

.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
}

.empty-box {
  text-align: center;
  padding: 36px 20px;
  color: var(--muted);
  background: #f9fafb;
  border-radius: 12px;
  border: 1px dashed var(--border);
}

.status-badge {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
}

.status-pending { background: #fef3c7; color: #92400e; }
.status-accepted { background: #dbeafe; color: #1d4ed8; }
.status-delivered { background: #dcfce7; color: #166534; }

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  font-size: 0.9rem;
  font-weight: 600;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 0.95rem;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(0, 170, 102, 0.15);
}

@media (max-width: 900px) {
  .app-layout { grid-template-columns: 1fr; }

  .sidebar {
    position: fixed;
    left: -100%;
    z-index: 1000;
    transition: left 0.3s ease;
  }

  .sidebar.open { left: 0; }

  .topbar { display: flex; }
  .menu-btn { display: inline-block; }
  .main { padding: 18px; }
}
</style>
{% block extra_styles %}{% endblock %}
</head>
<body>
<div class="app-layout">
  {% include 'food/includes/user_sidebar.html' %}

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" type="button" id="menuBtn" aria-label="Open menu">☰</button>
      <strong>HomeBites</strong>
    </div>
    {% block content %}{% endblock %}
  </main>
</div>

<script>
const menuBtn = document.getElementById('menuBtn');
const sidebar = document.getElementById('sidebar');

if (menuBtn && sidebar) {
  menuBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
  document.addEventListener('click', (event) => {
    if (window.innerWidth <= 900 && sidebar.classList.contains('open')) {
      if (!sidebar.contains(event.target) && !menuBtn.contains(event.target)) {
        sidebar.classList.remove('open');
      }
    }
  });
}
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
