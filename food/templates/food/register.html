<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.form-box{
background:white;
padding:30px;
width:350px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:6px;
}

button{
width:100%;
padding:10px;
background:#00aa66;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#008f55;
}

</style>

</head>

<body>

<div class="form-box">

<h2>Register</h2>

<form method="POST">
{% csrf_token %}

<input type="text" name="name" placeholder="Full Name" required>

<input type="text" name="mobile" placeholder="Mobile Number" required>

<input type="email" name="email" placeholder="Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Register</button>

</form>

</div>

</body>
</html>
