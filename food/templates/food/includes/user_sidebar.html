<aside class="sidebar" id="sidebar">
  <a href="{% url 'home' %}" class="brand">
    <img src="/media/Logo/Logo_Circular.jpeg" alt="HomeBites logo">
    <span>HomeBites</span>
  </a>

  <div class="user-card">
    <div class="user-avatar">
      <img src="{{ user.profile_photo_url }}" alt="{{ user.name }}">
    </div>
    <h3>Welcome, {{ user.name }}</h3>
    <p>{{ user.email }}</p>
  </div>

  <nav class="sidebar-nav">
    <a href="{% url 'dashboard' %}" class="nav-link {% if active_nav == 'dashboard' %}active{% endif %}">
      <span class="nav-icon">📊</span><span class="nav-text">Dashboard</span>
    </a>
    <a href="{% url 'food_list' %}" class="nav-link {% if active_nav == 'menu' %}active{% endif %}">
      <span class="nav-icon">🍽️</span><span class="nav-text">Browse Menu</span>
    </a>
    <a href="{% url 'my_orders' %}" class="nav-link {% if active_nav == 'orders' %}active{% endif %}">
      <span class="nav-icon">📦</span><span class="nav-text">My Orders</span>
    </a>
    <a href="{% url 'profile' %}" class="nav-link {% if active_nav == 'profile' %}active{% endif %}">
      <span class="nav-icon">👤</span><span class="nav-text">Profile</span>
    </a>
    <a href="{% url 'home' %}" class="nav-link {% if active_nav == 'home' %}active{% endif %}">
      <span class="nav-icon">🏠</span><span class="nav-text">Homepage</span>
    </a>
    <a href="{% url 'logout' %}" class="nav-link logout-link">
      <span class="nav-icon">🚪</span><span class="nav-text">Logout</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <p>Member since {{ user.created_at|date:"M Y" }}</p>
  </div>
</aside>
