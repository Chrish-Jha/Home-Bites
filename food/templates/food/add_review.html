{% extends 'food/user_base.html' %}

{% block title %}Add Review | HomeBites{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Add Review</h1>
    <p>Share your experience for <strong>{{ food.name }}</strong>.</p>
  </div>
  <a href="{% url 'food_detail' food.id %}" class="btn btn-secondary">← Back</a>
</div>

<section class="panel" style="max-width:560px;">
  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label for="rating">Rating (1-5)</label>
      <select id="rating" name="rating" required>
        <option value="">Select rating</option>
        <option value="5">★★★★★ Excellent</option>
        <option value="4">★★★★☆ Very Good</option>
        <option value="3">★★★☆☆ Good</option>
        <option value="2">★★☆☆☆ Fair</option>
        <option value="1">★☆☆☆☆ Poor</option>
      </select>
    </div>
    <div class="form-group">
      <label for="comment">Your Review</label>
      <textarea id="comment" name="comment" rows="5" placeholder="Tell others about taste, quality, and experience..." required></textarea>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Submit Review</button>
  </form>
</section>
{% endblock %}
