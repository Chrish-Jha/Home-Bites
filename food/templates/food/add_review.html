<!DOCTYPE html>
<html>
<head>

<title>Add Review</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:30px;
width:350px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

input,textarea{
width:100%;
padding:10px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:6px;
}

button{
padding:10px;
width:100%;
background:#0077ff;
border:none;
color:white;
border-radius:6px;
}

</style>

</head>

<body>

<div class="box">

<h2>Add Review</h2>

<form method="POST">

{% csrf_token %}

<input type="number" name="rating" placeholder="Rating (1-5)">

<textarea name="comment" placeholder="Write review"></textarea>

<button type="submit">Submit</button>

</form>

</div>

</body>
</html>
