<!DOCTYPE html>
<html>
<head>

<title>Add Food</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:30px;
width:400px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
margin-bottom:20px;
}

input, textarea{
width:100%;
padding:10px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:6px;
}

button{
padding:10px;
width:100%;
background:#00aa66;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#008f55;
}

</style>

</head>

<body>

<div class="box">

<h2>Add Food Item</h2>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<input type="text" name="name" placeholder="Food Name" required>

<textarea name="description" placeholder="Food Description"></textarea>

<input type="number" name="price" placeholder="Price" required>

<input type="file" name="image" required>

<button type="submit">
Add Food
</button>

</form>

</div>

</body>
</html>
